<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-hover-card example</title>
  <link rel="stylesheet" href="../../kata-hover-card/kata-hover-card.css">
  <style>
    body { font-family: sans-serif; padding: 4rem; }
  </style>
</head>
<body>
  <h1>kata-hover-card examples</h1>

  <template id="kata-hover-card-template">
    <button type="button" data-hover-card-trigger>山田太郎</button>
    <div data-hover-card-content class="hover-card-content" hidden>
      <p class="hover-card-title">山田太郎</p>
      <p class="hover-card-description">2023年1月から利用中</p>
    </div>
  </template>

  <kata-hover-card></kata-hover-card>

  <script type="module" src="../../kata-hover-card/kata-hover-card.js"></script>
</body>
</html>
