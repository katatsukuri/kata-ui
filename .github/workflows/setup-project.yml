name: Setup Project (Milestones, Issues, Project)

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create Milestone 1 – プレーンHTML構造コンポーネント
        id: ms1
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.createMilestone({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Milestone 1: プレーンHTML構造コンポーネント',
              description: 'ビルドレス・フレームワークレスで動作する基本UIコンポーネント群の実装。\nButton / Toggle / Toggle Group / Input / Textarea / Checkbox / Radio Group / Switch / Select / Slider / Card / Table（dense-table）/ Accordion / Avatar / Badge / Tabs / Dropdown Menu / Breadcrumb / Pagination',
            });
            console.log(`Created milestone: ${data.number}`);
            return data.number;

      - name: Create Milestone 2 – アクセシビリティ拡張コンポーネント
        id: ms2
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.createMilestone({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Milestone 2: アクセシビリティ拡張コンポーネント',
              description: '@alpinejs/focus・@alpinejs/anchor プラグインを併用するコンポーネント群の実装。\nDialog / Alert Dialog / Sheet / Drawer / Popover / Tooltip / Hover Card',
            });
            console.log(`Created milestone: ${data.number}`);
            return data.number;

      - name: Create Milestone 3 – 可視化コンポーネント
        id: ms3
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.createMilestone({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Milestone 3: 可視化コンポーネント',
              description: '外部ライブラリ（Chart.js / D3）を任意導入する可視化コンポーネント群の実装。\nCharts',
            });
            console.log(`Created milestone: ${data.number}`);
            return data.number;

      - name: Create Issues for Milestone 1 components
        uses: actions/github-script@v7
        with:
          script: |
            // マイルストーン番号を取得
            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const ms1 = milestones.data.find(m => m.title.includes('Milestone 1'));
            const ms2 = milestones.data.find(m => m.title.includes('Milestone 2'));
            const ms3 = milestones.data.find(m => m.title.includes('Milestone 3'));

            const components = [
              // Milestone 1: プレーンHTML構造コンポーネント
              { title: 'feat: Button コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-button>` カスタム要素の実装。\n\n## タスク\n- [ ] `button-spec.md`（HTML契約）を作成\n- [ ] `button.js` を実装\n- [ ] `button.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Toggle コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-toggle>` カスタム要素の実装。\n\n## タスク\n- [ ] `toggle-spec.md` を作成\n- [ ] `toggle.js` を実装\n- [ ] `toggle.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Toggle Group コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-toggle-group>` カスタム要素の実装。\n\n## タスク\n- [ ] `toggle-group-spec.md` を作成\n- [ ] `toggle-group.js` を実装\n- [ ] `toggle-group.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Input コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-input>` カスタム要素の実装。\n\n## タスク\n- [ ] `input-spec.md` を作成\n- [ ] `input.js` を実装\n- [ ] `input.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Textarea コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-textarea>` カスタム要素の実装。\n\n## タスク\n- [ ] `textarea-spec.md` を作成\n- [ ] `textarea.js` を実装\n- [ ] `textarea.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Checkbox コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-checkbox>` カスタム要素の実装。\n\n## タスク\n- [ ] `checkbox-spec.md` を作成\n- [ ] `checkbox.js` を実装\n- [ ] `checkbox.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Radio Group コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-radio-group>` カスタム要素の実装。\n\n## タスク\n- [ ] `radio-group-spec.md` を作成\n- [ ] `radio-group.js` を実装\n- [ ] `radio-group.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Switch コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-switch>` カスタム要素の実装。\n\n## タスク\n- [ ] `switch-spec.md` を作成\n- [ ] `switch.js` を実装\n- [ ] `switch.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Select コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-select>` カスタム要素の実装。\n\n## タスク\n- [ ] `select-spec.md` を作成\n- [ ] `select.js` を実装\n- [ ] `select.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Slider コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-slider>` カスタム要素の実装。\n\n## タスク\n- [ ] `slider-spec.md` を作成\n- [ ] `slider.js` を実装\n- [ ] `slider.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Card コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-card>` カスタム要素の実装。\n\n## タスク\n- [ ] `card-spec.md` を作成\n- [ ] `card.js` を実装\n- [ ] `card.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Table（dense-table）コンポーネントの完成', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n既存の `<dense-table>` カスタム要素の仕上げ・ドキュメント整備。\n\n## タスク\n- [ ] `dense-table-spec.md` を最新化\n- [ ] `dense-table.js` を確認・修正\n- [ ] `dense-table.css` を確認・修正\n- [ ] `examples/` に razor / ejs / django 分の利用例を追加' },
              { title: 'feat: Accordion コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-accordion>` カスタム要素の実装。\n\n## タスク\n- [ ] `accordion-spec.md` を作成\n- [ ] `accordion.js` を実装\n- [ ] `accordion.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Avatar コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-avatar>` カスタム要素の実装。\n\n## タスク\n- [ ] `avatar-spec.md` を作成\n- [ ] `avatar.js` を実装\n- [ ] `avatar.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Badge コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-badge>` カスタム要素の実装。\n\n## タスク\n- [ ] `badge-spec.md` を作成\n- [ ] `badge.js` を実装\n- [ ] `badge.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Tabs コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-tabs>` カスタム要素の実装。\n\n## タスク\n- [ ] `tabs-spec.md` を作成\n- [ ] `tabs.js` を実装\n- [ ] `tabs.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Dropdown Menu コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-dropdown-menu>` カスタム要素の実装。\n\n## タスク\n- [ ] `dropdown-menu-spec.md` を作成\n- [ ] `dropdown-menu.js` を実装\n- [ ] `dropdown-menu.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Breadcrumb コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-breadcrumb>` カスタム要素の実装。\n\n## タスク\n- [ ] `breadcrumb-spec.md` を作成\n- [ ] `breadcrumb.js` を実装\n- [ ] `breadcrumb.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Pagination コンポーネントの実装', milestone: ms1.number, labels: ['component', 'milestone-1'],
                body: '## 概要\n`<kata-pagination>` カスタム要素の実装。\n\n## タスク\n- [ ] `pagination-spec.md` を作成\n- [ ] `pagination.js` を実装\n- [ ] `pagination.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },

              // Milestone 2: アクセシビリティ拡張コンポーネント
              { title: 'feat: Dialog コンポーネントの実装', milestone: ms2.number, labels: ['component', 'milestone-2', 'a11y'],
                body: '## 概要\n`<kata-dialog>` カスタム要素の実装。`@alpinejs/focus` によるフォーカストラップが必要。\n\n## タスク\n- [ ] `dialog-spec.md` を作成\n- [ ] `dialog.js` を実装（`@alpinejs/focus` 依存）\n- [ ] `dialog.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Alert Dialog コンポーネントの実装', milestone: ms2.number, labels: ['component', 'milestone-2', 'a11y'],
                body: '## 概要\n`<kata-alert-dialog>` カスタム要素の実装。`@alpinejs/focus` によるフォーカストラップが必要。\n\n## タスク\n- [ ] `alert-dialog-spec.md` を作成\n- [ ] `alert-dialog.js` を実装\n- [ ] `alert-dialog.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Sheet コンポーネントの実装', milestone: ms2.number, labels: ['component', 'milestone-2', 'a11y'],
                body: '## 概要\n`<kata-sheet>` カスタム要素の実装。`@alpinejs/focus` によるフォーカストラップが必要。\n\n## タスク\n- [ ] `sheet-spec.md` を作成\n- [ ] `sheet.js` を実装\n- [ ] `sheet.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Drawer コンポーネントの実装', milestone: ms2.number, labels: ['component', 'milestone-2', 'a11y'],
                body: '## 概要\n`<kata-drawer>` カスタム要素の実装。`@alpinejs/focus` によるフォーカストラップが必要。\n\n## タスク\n- [ ] `drawer-spec.md` を作成\n- [ ] `drawer.js` を実装\n- [ ] `drawer.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Popover コンポーネントの実装', milestone: ms2.number, labels: ['component', 'milestone-2', 'a11y'],
                body: '## 概要\n`<kata-popover>` カスタム要素の実装。`@alpinejs/anchor` による配置制御が必要。\n\n## タスク\n- [ ] `popover-spec.md` を作成\n- [ ] `popover.js` を実装\n- [ ] `popover.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Tooltip コンポーネントの実装', milestone: ms2.number, labels: ['component', 'milestone-2', 'a11y'],
                body: '## 概要\n`<kata-tooltip>` カスタム要素の実装。`@alpinejs/anchor` による配置制御が必要。\n\n## タスク\n- [ ] `tooltip-spec.md` を作成\n- [ ] `tooltip.js` を実装\n- [ ] `tooltip.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },
              { title: 'feat: Hover Card コンポーネントの実装', milestone: ms2.number, labels: ['component', 'milestone-2', 'a11y'],
                body: '## 概要\n`<kata-hover-card>` カスタム要素の実装。`@alpinejs/anchor` による配置制御が必要。\n\n## タスク\n- [ ] `hover-card-spec.md` を作成\n- [ ] `hover-card.js` を実装\n- [ ] `hover-card.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加' },

              // Milestone 3: 可視化コンポーネント
              { title: 'feat: Charts コンポーネントの実装（Chart.js）', milestone: ms3.number, labels: ['component', 'milestone-3', 'visualization'],
                body: '## 概要\n`<kata-chart>` カスタム要素の実装。Chart.js を標準とし、複雑な表現が必要な場合は D3 を選択可能とする。\n\n## タスク\n- [ ] `chart-spec.md` を作成\n- [ ] `chart.js`（Chart.js ラッパー）を実装\n- [ ] `chart.css` を実装\n- [ ] `examples/` に最低1バックエンド分の利用例を追加\n- [ ] D3 対応バリアントの検討・実装（任意）' },
            ];

            for (const c of components) {
              // ラベルを事前作成（存在しない場合）
              for (const label of c.labels) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label,
                    color: label === 'component' ? '0075ca' :
                           label === 'milestone-1' ? '00a651' :
                           label === 'milestone-2' ? 'e4e669' :
                           label === 'milestone-3' ? 'd93f0b' :
                           label === 'a11y' ? 'bfd4f2' :
                           label === 'visualization' ? 'f9d0c4' : 'ededed',
                  });
                } catch (e) {
                  // ラベルが既に存在する場合は無視
                }
              }

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: c.title,
                body: c.body,
                labels: c.labels,
                milestone: c.milestone,
              });
              console.log(`Created issue: ${c.title}`);
            }

      - name: Create GitHub Project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // GraphQL でプロジェクト（Projects v2）を作成
            const owner = context.repo.owner;

            // オーナーのIDを取得
            const { user } = await github.graphql(`
              query($login: String!) {
                user(login: $login) { id }
              }
            `, { login: owner });

            // プロジェクトを作成
            const { createProjectV2 } = await github.graphql(`
              mutation($ownerId: ID!, $title: String!) {
                createProjectV2(input: { ownerId: $ownerId, title: $title }) {
                  projectV2 { id number url }
                }
              }
            `, { ownerId: user.id, title: 'kata-ui コンポーネント実装トラッキング' });

            console.log(`Created project: ${createProjectV2.projectV2.url}`);

            // リポジトリの全Issueをプロジェクトに追加
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const projectId = createProjectV2.projectV2.id;

            for (const issue of issues.data) {
              try {
                await github.graphql(`
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                      item { id }
                    }
                  }
                `, { projectId, contentId: issue.node_id });
                console.log(`Added issue #${issue.number} to project`);
              } catch (e) {
                console.error(`Failed to add issue #${issue.number}: ${e.message}`);
              }
            }
