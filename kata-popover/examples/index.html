<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-popover example</title>
  <link rel="stylesheet" href="../../kata-popover/kata-popover.css">
  <style>
    body { font-family: sans-serif; padding: 4rem 2rem; }
    .demo { display: flex; gap: 2rem; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <h1>kata-popover examples</h1>

  <div class="demo">

    <!-- Bottom (default) -->
    <template id="kata-popover-bottom-template">
      <button type="button" data-popover-trigger aria-expanded="false">
        下に表示
      </button>
      <div data-popover-content hidden role="dialog" aria-label="詳細情報（下）">
        <strong>ポップオーバー（下）</strong>
        <p>トリガーの下に表示されます。</p>
      </div>
    </template>
    <kata-popover template="kata-popover-bottom-template" data-placement="bottom"></kata-popover>

    <!-- Top -->
    <template id="kata-popover-top-template">
      <button type="button" data-popover-trigger aria-expanded="false">
        上に表示
      </button>
      <div data-popover-content hidden role="dialog" aria-label="詳細情報（上）">
        <strong>ポップオーバー（上）</strong>
        <p>トリガーの上に表示されます。</p>
      </div>
    </template>
    <kata-popover template="kata-popover-top-template" data-placement="top"></kata-popover>

    <!-- Right -->
    <template id="kata-popover-right-template">
      <button type="button" data-popover-trigger aria-expanded="false">
        右に表示
      </button>
      <div data-popover-content hidden role="dialog" aria-label="詳細情報（右）">
        <strong>ポップオーバー（右）</strong>
        <p>トリガーの右に表示されます。</p>
      </div>
    </template>
    <kata-popover template="kata-popover-right-template" data-placement="right"></kata-popover>

    <!-- Left -->
    <template id="kata-popover-left-template">
      <button type="button" data-popover-trigger aria-expanded="false">
        左に表示
      </button>
      <div data-popover-content hidden role="dialog" aria-label="詳細情報（左）">
        <strong>ポップオーバー（左）</strong>
        <p>トリガーの左に表示されます。</p>
      </div>
    </template>
    <kata-popover template="kata-popover-left-template" data-placement="left"></kata-popover>

  </div>

  <script type="module" src="../../kata-popover/kata-popover.js"></script>
</body>
</html>
