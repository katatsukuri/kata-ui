<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-switch example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-switch.css">
</head>
<body>
  <h1>kata-switch examples</h1>

  <template id="kata-switch-template">
    <label for="notify-switch"><slot name="label">通知</slot></label>
    <input id="notify-switch" type="checkbox" role="switch" name="notify">
  </template>

  <template id="kata-switch-checked-template">
    <label for="dark-switch"><slot name="label">ダークモード</slot></label>
    <input id="dark-switch" type="checkbox" role="switch" name="dark" checked>
  </template>

  <template id="kata-switch-disabled-template">
    <label for="disabled-switch"><slot name="label">無効（変更不可）</slot></label>
    <input id="disabled-switch" type="checkbox" role="switch" name="disabled" disabled>
  </template>

  <p><kata-switch><span slot="label">通知</span></kata-switch></p>
  <p><kata-switch template="kata-switch-checked-template"><span slot="label">ダークモード</span></kata-switch></p>
  <p><kata-switch template="kata-switch-disabled-template"><span slot="label">無効（変更不可）</span></kata-switch></p>

  <script type="module" src="../kata-switch.js"></script>
</body>
</html>
