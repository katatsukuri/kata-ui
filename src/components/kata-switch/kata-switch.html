<!-- Canonical Light DOM templates for <kata-switch>. Copy only the templates required by the page. -->
<template id="kata-switch-template">
    <label for="notify-switch">通知</label>
    <input id="notify-switch" type="checkbox" role="switch" name="notify">
  </template>

<template id="kata-switch-checked-template">
    <label for="dark-switch">ダークモード</label>
    <input id="dark-switch" type="checkbox" role="switch" name="dark" checked>
  </template>

<template id="kata-switch-disabled-template">
    <label for="disabled-switch">無効（変更不可）</label>
    <input id="disabled-switch" type="checkbox" role="switch" name="disabled" disabled>
  </template>
