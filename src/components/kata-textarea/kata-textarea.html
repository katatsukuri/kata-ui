<!-- Canonical Shadow DOM fallback templates for <kata-textarea>. Copy only the templates required by the page. -->
<template id="kata-textarea-template">
    <label for="bio-field">自己紹介</label>
    <textarea id="bio-field" name="bio" rows="4" placeholder="自己紹介を入力してください"></textarea>
  </template>

<template id="kata-textarea-disabled-template">
    <label for="note-field">メモ（無効）</label>
    <textarea id="note-field" name="note" rows="3" disabled>編集不可のテキスト</textarea>
  </template>
