<!-- Canonical Shadow DOM fallback templates for <kata-tooltip>. Copy only the templates required by the page. -->
<template id="kata-tooltip-template">
    <button type="button" class="kata-tooltip__trigger" aria-describedby="tip-top">
      <slot name="trigger">上（デフォルト）</slot>
    </button>
    <div class="kata-tooltip__content" id="tip-top" role="tooltip" data-side="top">
      <slot>上に表示されます</slot>
    </div>
  </template>
