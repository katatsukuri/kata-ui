<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-badge example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-badge.css">
</head>
<body>
  <h1>kata-badge examples</h1>

  <template id="kata-badge-template">
    <span class="kata-badge"><slot>新着</slot></span>
  </template>
  <template id="kata-badge-secondary-template">
    <span class="kata-badge" data-variant="secondary"><slot>Draft</slot></span>
  </template>
  <template id="kata-badge-outline-template">
    <span class="kata-badge" data-variant="outline"><slot>タグ</slot></span>
  </template>
  <template id="kata-badge-destructive-template">
    <span class="kata-badge" data-variant="destructive"><slot>削除済み</slot></span>
  </template>

  <p>
    <kata-badge>新着</kata-badge>
    <kata-badge template="kata-badge-secondary-template">Draft</kata-badge>
    <kata-badge template="kata-badge-outline-template">タグ</kata-badge>
    <kata-badge template="kata-badge-destructive-template">削除済み</kata-badge>
  </p>

  <script type="module" src="../kata-badge.js"></script>
</body>
</html>
