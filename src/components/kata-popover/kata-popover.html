<!-- Canonical Shadow DOM fallback templates for <kata-popover>. Copy only the templates required by the page. -->
<template id="kata-popover-template">
  <button type="button" data-popover-trigger aria-expanded="false">
    <slot name="trigger">詳細</slot>
  </button>
  <div data-popover-content hidden role="dialog" aria-label="詳細情報">
    <strong><slot name="title">ポップオーバー</slot></strong>
    <slot><p>補足情報を表示します。</p></slot>
  </div>
</template>

<template id="kata-popover-bottom-template">
      <button type="button" data-popover-trigger aria-expanded="false">
        <slot name="trigger">下に表示</slot>
      </button>
      <div data-popover-content hidden role="dialog" aria-label="詳細情報（下）">
        <strong><slot name="title">ポップオーバー（下）</slot></strong>
        <slot><p>トリガーの下に表示されます。</p></slot>
      </div>
    </template>
