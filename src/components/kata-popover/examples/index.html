<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-popover example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-popover.css">
  <style>
    body { font-family: sans-serif; padding: 4rem 2rem; }
    .demo { display: flex; gap: 2rem; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
  <h1>kata-popover examples</h1>

  <div class="demo">

    <!-- Bottom (default) -->
    <template id="kata-popover-bottom-template">
      <button type="button" data-popover-trigger aria-expanded="false">
        <slot name="trigger">下に表示</slot>
      </button>
      <div data-popover-content hidden role="dialog" aria-label="詳細情報（下）">
        <strong><slot name="title">ポップオーバー（下）</slot></strong>
        <slot><p>トリガーの下に表示されます。</p></slot>
      </div>
    </template>
    <kata-popover template="kata-popover-bottom-template" data-placement="bottom">
      <span slot="trigger">下に表示</span><span slot="title">下の情報</span><p>トリガーの下に表示されます。</p>
    </kata-popover>

    <!-- Top -->
    <template id="kata-popover-top-template">
      <button type="button" data-popover-trigger aria-expanded="false">
        <slot name="trigger">上に表示</slot>
      </button>
      <div data-popover-content hidden role="dialog" aria-label="詳細情報（上）">
        <strong><slot name="title">ポップオーバー（上）</slot></strong>
        <slot><p>トリガーの上に表示されます。</p></slot>
      </div>
    </template>
    <kata-popover template="kata-popover-top-template" data-placement="top">
      <span slot="trigger">上に表示</span><span slot="title">上の情報</span><p>トリガーの上に表示されます。</p>
    </kata-popover>

    <!-- Right -->
    <template id="kata-popover-right-template">
      <button type="button" data-popover-trigger aria-expanded="false">
        <slot name="trigger">右に表示</slot>
      </button>
      <div data-popover-content hidden role="dialog" aria-label="詳細情報（右）">
        <strong><slot name="title">ポップオーバー（右）</slot></strong>
        <slot><p>トリガーの右に表示されます。</p></slot>
      </div>
    </template>
    <kata-popover template="kata-popover-right-template" data-placement="right">
      <span slot="trigger">右に表示</span><span slot="title">右の情報</span><p>トリガーの右に表示されます。</p>
    </kata-popover>

    <!-- Left -->
    <template id="kata-popover-left-template">
      <button type="button" data-popover-trigger aria-expanded="false">
        <slot name="trigger">左に表示</slot>
      </button>
      <div data-popover-content hidden role="dialog" aria-label="詳細情報（左）">
        <strong><slot name="title">ポップオーバー（左）</slot></strong>
        <slot><p>トリガーの左に表示されます。</p></slot>
      </div>
    </template>
    <kata-popover template="kata-popover-left-template" data-placement="left">
      <span slot="trigger">左に表示</span><span slot="title">左の情報</span><p>トリガーの左に表示されます。</p>
    </kata-popover>

  </div>

  <script type="module" src="../kata-popover.js"></script>
</body>
</html>
