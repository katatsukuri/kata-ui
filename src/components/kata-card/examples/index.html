<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-card example</title>
  <link rel="stylesheet" href="../kata-card.css">
</head>
<body>
  <h1>kata-card examples</h1>

  <template id="kata-card-template">
    <div class="kata-card">
      <div class="kata-card__header">
        <h2 class="kata-card__title">アカウント情報</h2>
        <p class="kata-card__description">登録済みのアカウント情報を確認します。</p>
      </div>
      <div class="kata-card__content">
        <p>名前: 山田太郎</p>
        <p>メール: yamada@example.com</p>
      </div>
      <div class="kata-card__footer">
        <button type="button">編集</button>
      </div>
    </div>
  </template>

  <kata-card></kata-card>

  <script type="module" src="../kata-card.js"></script>
</body>
</html>
