<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-card example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-card.css">
</head>
<body>
  <h1>kata-card examples</h1>

  <template id="kata-card-template">
    <div class="kata-card">
      <div class="kata-card__header">
        <h2 class="kata-card__title"><slot name="title">アカウント情報</slot></h2>
        <p class="kata-card__description"><slot name="description">登録済みのアカウント情報を確認します。</slot></p>
      </div>
      <div class="kata-card__content">
        <slot><p>名前: 山田太郎</p><p>メール: yamada@example.com</p></slot>
      </div>
      <div class="kata-card__footer">
        <button type="button"><slot name="action">編集</slot></button>
      </div>
    </div>
  </template>

  <kata-card>
    <span slot="title">アカウント情報</span>
    <span slot="description">登録済みの情報を確認します。</span>
    <p>名前: 山田太郎</p>
    <span slot="action">編集</span>
  </kata-card>

  <kata-card>
    <strong slot="title">slotから渡した見出し</strong>
    <span slot="description">UI骨格を変えずに表示データを注入します。</span>
    <p>意味を持つHTMLはdefault slotへ渡します。</p>
    <span slot="action">確認</span>
  </kata-card>

  <script type="module" src="../kata-card.js"></script>
</body>
</html>
