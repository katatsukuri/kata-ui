<!-- Canonical Shadow DOM fallback templates for <kata-button>. Copy only the templates required by the page. -->
<template id="kata-button-template">
    <button type="button"><slot>保存</slot></button>
  </template>

<template id="kata-button-secondary-template">
    <button type="button" data-variant="secondary"><slot>キャンセル</slot></button>
  </template>

<template id="kata-button-destructive-template">
    <button type="button" data-variant="destructive"><slot>削除</slot></button>
  </template>

<template id="kata-button-disabled-template">
    <button type="button" disabled><slot>送信（無効）</slot></button>
  </template>
