<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-button example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-button.css">
</head>
<body>
  <h1>kata-button examples</h1>

  <template id="kata-button-template">
    <button type="button"><slot>保存</slot></button>
  </template>

  <p>
    <kata-button>保存</kata-button>
    <kata-button>更新</kata-button>
    <kata-button variant="secondary">キャンセル</kata-button>
    <kata-button variant="destructive">削除</kata-button>
    <kata-button disabled>送信（無効）</kata-button>
  </p>

  <script type="module" src="../kata-button.js"></script>
</body>
</html>
