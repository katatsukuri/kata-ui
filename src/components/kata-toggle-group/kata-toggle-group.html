<!-- Canonical Light DOM templates for <kata-toggle-group>. Copy only the templates required by the page. -->
<template id="kata-toggle-group-template">
    <div role="group" aria-label="テキスト整形">
      <button type="button" role="button" data-toggle-item aria-pressed="false">Bold</button>
      <button type="button" role="button" data-toggle-item aria-pressed="false">Italic</button>
      <button type="button" role="button" data-toggle-item aria-pressed="false">Underline</button>
    </div>
  </template>

<template id="kata-toggle-group-align-template">
    <div role="group" aria-label="文字揃え">
      <button type="button" role="button" data-toggle-item aria-pressed="true" data-active>左揃え</button>
      <button type="button" role="button" data-toggle-item aria-pressed="false">中央揃え</button>
      <button type="button" role="button" data-toggle-item aria-pressed="false">右揃え</button>
    </div>
  </template>
