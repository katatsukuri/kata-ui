<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-toggle-group example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-toggle-group.css">
</head>
<body>
  <h1>kata-toggle-group examples</h1>

  <h2>複数選択（デフォルト）</h2>
  <template id="kata-toggle-group-template">
    <div role="group" aria-label="テキスト整形">
      <slot><button type="button" data-toggle-item aria-pressed="false">Bold</button></slot>
    </div>
  </template>

  <kata-toggle-group>
    <button type="button" data-toggle-item aria-pressed="false">Bold</button>
    <button type="button" data-toggle-item aria-pressed="false">Italic</button>
    <button type="button" data-toggle-item aria-pressed="false">Underline</button>
  </kata-toggle-group>

  <h2>単一選択（type="single"）</h2>
  <kata-toggle-group type="single">
    <button type="button" data-toggle-item aria-pressed="true" data-active>左揃え</button>
    <button type="button" data-toggle-item aria-pressed="false">中央揃え</button>
    <button type="button" data-toggle-item aria-pressed="false">右揃え</button>
  </kata-toggle-group>

  <script type="module" src="../kata-toggle-group.js"></script>
</body>
</html>
