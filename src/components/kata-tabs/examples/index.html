<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-tabs example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-tabs.css">
</head>
<body>
  <h1>kata-tabs examples</h1>

  <template id="kata-tabs-template">
    <div role="tablist" aria-label="設定">
      <button type="button" role="tab" data-tabs-trigger
              aria-selected="true" aria-controls="tab-account" data-active><slot name="tab-1">アカウント</slot></button>
      <button type="button" role="tab" data-tabs-trigger
              aria-selected="false" aria-controls="tab-password"><slot name="tab-2">パスワード</slot></button>
      <button type="button" role="tab" data-tabs-trigger
              aria-selected="false" aria-controls="tab-notify"><slot name="tab-3">通知</slot></button>
    </div>
    <div id="tab-account" role="tabpanel" data-tabs-panel>
      <slot name="panel-1"><p>アカウント情報の設定内容がここに表示されます。</p></slot>
    </div>
    <div id="tab-password" role="tabpanel" data-tabs-panel hidden>
      <slot name="panel-2"><p>パスワード変更フォームがここに表示されます。</p></slot>
    </div>
    <div id="tab-notify" role="tabpanel" data-tabs-panel hidden>
      <slot name="panel-3"><p>通知設定の内容がここに表示されます。</p></slot>
    </div>
  </template>

  <kata-tabs>
    <span slot="tab-1">アカウント</span><span slot="tab-2">パスワード</span><span slot="tab-3">通知</span>
    <p slot="panel-1">アカウント情報の設定内容です。</p>
    <p slot="panel-2">パスワード変更フォームです。</p>
    <p slot="panel-3">通知設定の内容です。</p>
  </kata-tabs>

  <script type="module" src="../kata-tabs.js"></script>
</body>
</html>
