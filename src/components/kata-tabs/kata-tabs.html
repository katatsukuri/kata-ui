<!-- Canonical Shadow DOM fallback templates for <kata-tabs>. Copy only the templates required by the page. -->
<template id="kata-tabs-template">
    <div role="tablist" aria-label="設定">
      <slot name="tab">
        <button type="button" role="tab" data-tabs-trigger aria-selected="true" aria-controls="tab-account" data-active>アカウント</button>
        <button type="button" role="tab" data-tabs-trigger aria-selected="false" aria-controls="tab-password">パスワード</button>
        <button type="button" role="tab" data-tabs-trigger aria-selected="false" aria-controls="tab-notify">通知</button>
      </slot>
    </div>
    <slot name="panel">
      <div id="tab-account" role="tabpanel" data-tabs-panel><p>アカウント情報の設定内容がここに表示されます。</p></div>
      <div id="tab-password" role="tabpanel" data-tabs-panel hidden><p>パスワード変更フォームがここに表示されます。</p></div>
      <div id="tab-notify" role="tabpanel" data-tabs-panel hidden><p>通知設定の内容がここに表示されます。</p></div>
    </slot>
  </template>
