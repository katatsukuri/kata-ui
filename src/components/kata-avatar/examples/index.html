<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-avatar example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-avatar.css">
</head>
<body>
  <h1>kata-avatar examples</h1>

  <template id="kata-avatar-template">
    <span class="kata-avatar"><slot>YN</slot></span>
  </template>

  <h2>画像アバター</h2>
  <p>
    <kata-avatar><img src="../../../../assets/avatar-placeholder.svg" alt="ユーザー"></kata-avatar>
  </p>

  <h2>イニシャルアバター</h2>
  <p>
    <kata-avatar>AB</kata-avatar>
  </p>

  <h2>サイズバリエーション</h2>
  <p>
    <kata-avatar size="sm">SM</kata-avatar>
    <kata-avatar>MD</kata-avatar>
    <kata-avatar size="lg">LG</kata-avatar>
  </p>

  <script type="module" src="../kata-avatar.js"></script>
</body>
</html>
