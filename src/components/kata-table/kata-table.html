<!-- Canonical Shadow DOM fallback templates for <kata-table>. Copy only the templates required by the page. -->
<template id="kata-table-template">
  <table class="kata-table__table">
    <thead>
      <tr>
            <th scope="col"><slot name="column-1">Name</slot></th>
            <th scope="col"><slot name="column-2">Role</slot></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</template>

<template id="kata-table-all-users-template">
        <table class="kata-table">
          <thead>
            <tr>
          <th scope="col"><slot name="column-1">Name</slot></th>
          <th scope="col"><slot name="column-2">Role</slot></th>
            </tr>
          </thead>
          <tbody hx-get="/api/rows" hx-trigger="load" hx-target="this" hx-swap="innerHTML"></tbody>
        </table>
      </template>

<template id="kata-table-maintainers-template">
        <table class="kata-table">
          <thead>
            <tr>
          <th scope="col"><slot name="column-1">Maintainer</slot></th>
          <th scope="col"><slot name="column-2">Role</slot></th>
            </tr>
          </thead>
          <tbody hx-get="/api/maintainers" hx-trigger="load" hx-target="this" hx-swap="innerHTML"></tbody>
        </table>
      </template>
