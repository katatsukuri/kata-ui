<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kata-table example (Django)</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
    {# Django の staticfiles を使って kata-ui アセットを配信してください。 #}
    {# 例: STATICFILES_DIRS に kata-ui ディレクトリを追加する             #}
    {% load static %}
    <link rel="stylesheet" href="{% static 'kata-ui/src/components/kata-table/kata-table.css' %}">
    <script type="module"  src="{% static 'kata-ui/src/components/kata-table/kata-table.js' %}"></script>
    <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"></script>
  </head>
  <body class="container">
    <main>
      <h1>kata-table（Django）</h1>

      {# columns リストはビューから context = {'columns': [...]} で渡す #}
      <template id="kata-table-server-template">
        <table class="kata-table">
          <thead>
            <tr>
              <th scope="col"><slot name="column-1">Name</slot></th>
              <th scope="col"><slot name="column-2">Role</slot></th>
            </tr>
          </thead>
          <tbody
            hx-get="{% url 'api-rows' %}"
            hx-target="this"
            hx-swap="innerHTML"
            hx-trigger="load">
          </tbody>
        </table>
      </template>
      <kata-table template="kata-table-server-template">
        <span slot="column-1">{{ columns.0 }}</span>
        <span slot="column-2">{{ columns.1 }}</span>
      </kata-table>
    </main>
  </body>
</html>
