<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kata-table example</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
    <link rel="stylesheet" href="../../kata-table.css">
    <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"></script>
    <script type="module" src="../../kata-table.js"></script>
  </head>
  <body class="container">
    <main>
      <h1>kata-table prototype</h1>

      <template id="kata-table-all-users-template">
        <table class="kata-table">
          <thead><tr><th scope="col"><slot name="column-1">Name</slot></th><th scope="col"><slot name="column-2">Role</slot></th></tr></thead>
          <tbody hx-get="/api/rows" hx-trigger="load" hx-target="this" hx-swap="innerHTML"></tbody>
        </table>
      </template>

      <template id="kata-table-maintainers-template">
        <table class="kata-table">
          <thead><tr><th scope="col"><slot name="column-1">Maintainer</slot></th><th scope="col"><slot name="column-2">Role</slot></th></tr></thead>
          <tbody hx-get="/api/maintainers" hx-trigger="load" hx-target="this" hx-swap="innerHTML"></tbody>
        </table>
      </template>

      <div style="display:flex;gap:0.5rem;margin-bottom:1rem;align-items:center;">
        <button type="button"
                hx-get="/api/table?view=all"
                hx-target="#table-host"
                hx-swap="innerHTML">全ユーザー</button>
        <button type="button"
                hx-get="/api/table?view=maintainers"
                hx-target="#table-host"
                hx-swap="innerHTML">メンテナー</button>
      </div>

      <div id="table-host"
           hx-get="/api/table?view=all"
           hx-trigger="load"
           hx-target="this"
           hx-swap="innerHTML"></div>
    </main>
  </body>
</html>
