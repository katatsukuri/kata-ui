<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-input example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-input.css">
</head>
<body>
  <h1>kata-input examples</h1>

  <template id="kata-input-template">
    <label for="name-field"><slot name="label">名前</slot></label>
    <input id="name-field" type="text" name="name" placeholder="山田太郎">
  </template>

  <p><kata-input name="displayName" placeholder="山田太郎" required><span slot="label">氏名</span></kata-input></p>

  <script type="module" src="../kata-input.js"></script>
</body>
</html>
