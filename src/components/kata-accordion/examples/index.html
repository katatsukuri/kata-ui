<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-accordion example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-accordion.css">
</head>
<body>
  <h1>kata-accordion examples</h1>

  <template id="kata-accordion-template">
    <div data-accordion-item data-state="open">
      <button type="button" data-accordion-trigger
              aria-expanded="true" aria-controls="acc-1">kata-uiとは何ですか？</button>
      <div id="acc-1" data-accordion-content role="region">
        ビルドレス・フレームワークレスなWebコンポーネント集です。
      </div>
    </div>
    <div data-accordion-item data-state="closed">
      <button type="button" data-accordion-trigger
              aria-expanded="false" aria-controls="acc-2">Reactなしで使えますか？</button>
      <div id="acc-2" data-accordion-content role="region" hidden>
        はい。scriptタグを読み込むだけで利用できます。
      </div>
    </div>
    <div data-accordion-item data-state="closed">
      <button type="button" data-accordion-trigger
              aria-expanded="false" aria-controls="acc-3">どのバックエンドでも使えますか？</button>
      <div id="acc-3" data-accordion-content role="region" hidden>
        はい。契約（HTML構造の仕様）を満たせば、どのサーバーサイド環境でも利用できます。
      </div>
    </div>
  </template>

  <kata-accordion></kata-accordion>

  <script type="module" src="../kata-accordion.js"></script>
</body>
</html>
