<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-accordion example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-accordion.css">
</head>
<body>
  <h1>kata-accordion examples</h1>

  <template id="kata-accordion-template">
    <div data-accordion-item data-state="closed">
      <button type="button" data-accordion-trigger aria-expanded="false"></button>
      <div data-accordion-content role="region" hidden>
        <slot data-accordion-content-slot></slot>
      </div>
    </div>
  </template>

  <kata-accordion>
    <section data-accordion-title="kata-uiとは何ですか？" data-state="open">
      ビルドレス・フレームワークレスなWebコンポーネント集です。
    </section>
    <section data-accordion-title="Reactなしで使えますか？">
      はい。scriptタグを読み込むだけで利用できます。
    </section>
    <section data-accordion-title="どのバックエンドでも使えますか？">
      はい。HTML契約を満たせば、どのサーバーサイド環境でも利用できます。
    </section>
  </kata-accordion>

  <script type="module" src="../kata-accordion.js"></script>
</body>
</html>
