<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-accordion example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-accordion.css">
</head>
<body>
  <h1>kata-accordion examples</h1>

  <template id="kata-accordion-template">
    <slot></slot>
  </template>

  <template id="kata-accordion-item-template">
  <div class="kata-accordion__item">
    <button
      id="trigger"
      type="button"
      class="kata-accordion__trigger"
      data-accordion-trigger
      aria-expanded="false"
      aria-controls="content"
    >
      <slot name="title">デフォルトタイトル</slot>
      <span class="kata-accordion__icon" aria-hidden="true">▼</span>
    </button>
    <div
      id="content"
      class="kata-accordion__content"
      data-accordion-content
      role="region"
      aria-labelledby="trigger"
      hidden
    >
      <slot></slot>
    </div>
  </div>
</template>

  <kata-accordion>
    <kata-accordion-item data-state="open">
      <span slot="title">Katatsukuri UIとは何ですか？</span>
      <p>ビルドレス・フレームワークレスなWebコンポーネント集です。</p>
    </kata-accordion-item>
    <kata-accordion-item data-state="closed">
      <span slot="title">Reactなしで使えますか？</span>
      <p>はい。scriptタグを読み込むだけで利用できます。</p>
    </kata-accordion-item>
    <kata-accordion-item data-state="closed">
      <span slot="title">どのバックエンドでも使えますか？</span>
      <p>はい。HTML契約を満たせば、どのサーバーサイド環境でも利用できます。</p>
    </kata-accordion-item>
  </kata-accordion>

  <script type="module" src="../kata-accordion.js"></script>
</body>
</html>
