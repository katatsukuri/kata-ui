<!-- Canonical Shadow DOM templates for <kata-accordion> and <kata-accordion-item>. -->
<template id="kata-accordion-template">
  <slot></slot>
</template>

<template id="kata-accordion-item-template">
  <div class="kata-accordion__item">
    <button
      id="trigger"
      type="button"
      class="kata-accordion__trigger"
      data-accordion-trigger
      aria-expanded="false"
      aria-controls="content"
    >
      <slot name="title">デフォルトタイトル</slot>
      <span class="kata-accordion__icon" aria-hidden="true">▼</span>
    </button>
    <div
      id="content"
      class="kata-accordion__content"
      data-accordion-content
      role="region"
      aria-labelledby="trigger"
      hidden
    >
      <slot></slot>
    </div>
  </div>
</template>
