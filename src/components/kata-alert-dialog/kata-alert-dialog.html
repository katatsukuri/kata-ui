<!-- Canonical Shadow DOM fallback templates for <kata-alert-dialog>. Copy only the templates required by the page. -->
<template id="kata-alert-dialog-template">
    <button type="button" data-alert-dialog-trigger><slot name="trigger">削除する</slot></button>
    <dialog
      role="alertdialog"
      aria-labelledby="kata-alert-dialog__title"
      aria-describedby="alert-dialog-desc"
    >
      <div class="kata-alert-dialog__header">
        <h2 id="kata-alert-dialog__title" class="kata-alert-dialog__title"><slot name="title">本当に削除しますか？</slot></h2>
        <p id="alert-dialog-desc" class="kata-alert-dialog__description"><slot name="description">この操作は元に戻せません。続けますか？</slot></p>
      </div>
      <div class="kata-alert-dialog__content">
        <slot><p>削除するとすべてのデータが失われます。</p></slot>
      </div>
      <div class="kata-alert-dialog__footer">
        <button type="button" data-alert-dialog-close><slot name="cancel">キャンセル</slot></button>
        <button type="button" data-alert-dialog-close><slot name="confirm">削除する</slot></button>
      </div>
    </dialog>
  </template>
