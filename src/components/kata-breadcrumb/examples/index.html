<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-breadcrumb example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-breadcrumb.css">
</head>
<body>
  <h1>kata-breadcrumb examples</h1>

  <template id="kata-breadcrumb-template">
    <nav aria-label="パンくずリスト">
      <ol>
        <li><a href="#"><slot name="item-1">ホーム</slot></a></li>
        <li aria-hidden="true" data-breadcrumb-separator>/</li>
        <li><a href="#"><slot name="item-2">製品一覧</slot></a></li>
        <li aria-hidden="true" data-breadcrumb-separator>/</li>
        <li aria-current="page"><slot name="current">製品詳細</slot></li>
      </ol>
    </nav>
  </template>

  <kata-breadcrumb>
    <span slot="item-1">ホーム</span>
    <span slot="item-2">製品一覧</span>
    <span slot="current">製品詳細</span>
  </kata-breadcrumb>

  <script type="module" src="../kata-breadcrumb.js"></script>
</body>
</html>
