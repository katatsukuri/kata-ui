<title>kata-pagination example - 2ページ目</title>

<div class="pagination-page" data-page="2">
  <h2>コンポーネント一覧 2 / 3</h2>
  <ul>
    <li><strong>Button</strong><span>用途別の操作ボタンを表示します。</span></li>
    <li><strong>Checkbox</strong><span>複数選択や真偽値を入力します。</span></li>
    <li><strong>Input</strong><span>基本的なテキストを入力します。</span></li>
    <li><strong>Select</strong><span>候補一覧から値を選択します。</span></li>
  </ul>
</div>
