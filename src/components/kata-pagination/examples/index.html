<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-pagination example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-pagination.css">
</head>
<body>
  <h1>kata-pagination examples</h1>

  <template id="kata-pagination-template">
    <nav aria-label="ページネーション">
      <ol>
        <li><a href="?page=1" aria-label="前のページへ"><slot name="previous">&laquo;</slot></a></li>
        <li><a href="?page=1"><slot name="page-1">1</slot></a></li>
        <li><a href="?page=2" aria-current="page"><slot name="page-2">2</slot></a></li>
        <li><a href="?page=3"><slot name="page-3">3</slot></a></li>
        <li><a href="?page=4"><slot name="page-4">4</slot></a></li>
        <li><a href="?page=5"><slot name="page-5">5</slot></a></li>
        <li><a href="?page=3" aria-label="次のページへ"><slot name="next">&raquo;</slot></a></li>
      </ol>
    </nav>
  </template>

  <kata-pagination>
    <span slot="previous">前</span>
    <span slot="page-1">1</span>
    <span slot="page-2">2</span>
    <span slot="page-3">3</span>
    <span slot="page-4">4</span>
    <span slot="page-5">5</span>
    <span slot="next">次</span>
  </kata-pagination>

  <script type="module" src="../kata-pagination.js"></script>
</body>
</html>
