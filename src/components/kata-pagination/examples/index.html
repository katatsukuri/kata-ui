<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-pagination example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-pagination.css">
</head>
<body>
  <h1>kata-pagination examples</h1>

  <template id="kata-pagination-template">
    <nav aria-label="ページネーション">
      <ol>
        <slot><li><a href="?page=1">1</a></li></slot>
      </ol>
    </nav>
  </template>

  <kata-pagination>
    <li><a href="?page=1" aria-label="前のページへ">前</a></li>
    <li><a href="?page=1">1</a></li>
    <li><a href="?page=2" aria-current="page">2</a></li>
    <li><a href="?page=3">3</a></li>
    <li><a href="?page=3" aria-label="次のページへ">次</a></li>
  </kata-pagination>

  <script type="module" src="../kata-pagination.js"></script>
</body>
</html>
