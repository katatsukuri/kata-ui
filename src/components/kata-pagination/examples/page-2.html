<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="htmx-config" content='{"selfRequestsOnly":true,"allowScriptTags":false,"allowEval":false}'>
    <title>kata-pagination example - 2ページ目</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.min.css">
    <link rel="stylesheet" href="../../../styles/kata-ui.css">
    <link rel="stylesheet" href="../kata-pagination.css">
    <link rel="stylesheet" href="./example.css">
    <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"></script>
    <script type="module" src="../kata-pagination.js"></script>
    <script type="module" src="./example.js"></script>
  </head>
  <body class="container">
    <main id="pagination-example">
      <h1>kata-pagination example</h1>
      <p>ページ全体とPagination本体を残し、一覧とページ項目だけをHTMXで更新します。</p>

      <template id="kata-pagination-template">
        <nav aria-label="ページネーション">
          <ol>
            <slot><li><a href="./index.html">1</a></li></slot>
          </ol>
        </nav>
      </template>

      <section id="pagination-results" class="pagination-results" aria-live="polite" aria-atomic="true" hx-history-elt>
        <div class="pagination-page" data-page="2">
          <h2>コンポーネント一覧 2 / 3</h2>
          <ul>
            <li><strong>Button</strong><span>用途別の操作ボタンを表示します。</span></li>
            <li><strong>Checkbox</strong><span>複数選択や真偽値を入力します。</span></li>
            <li><strong>Input</strong><span>基本的なテキストを入力します。</span></li>
            <li><strong>Select</strong><span>候補一覧から値を選択します。</span></li>
          </ul>
        </div>
        <template data-pagination-items>
          <li><a href="./index.html" hx-get="./fragments/page-1.html" hx-push-url="./index.html" aria-label="前のページへ">前</a></li>
          <li><a href="./index.html" hx-get="./fragments/page-1.html" hx-push-url="./index.html">1</a></li>
          <li><a href="./page-2.html" hx-get="./fragments/page-2.html" hx-push-url="./page-2.html" aria-current="page">2</a></li>
          <li><a href="./page-3.html" hx-get="./fragments/page-3.html" hx-push-url="./page-3.html">3</a></li>
          <li><a href="./page-3.html" hx-get="./fragments/page-3.html" hx-push-url="./page-3.html" aria-label="次のページへ">次</a></li>
        </template>
      </section>

      <kata-pagination
        id="results-pagination"
        hx-target="#pagination-results"
        hx-swap="innerHTML"
        hx-sync="#results-pagination:replace">
        <li><a href="./index.html" hx-get="./fragments/page-1.html" hx-push-url="./index.html" aria-label="前のページへ">前</a></li>
        <li><a href="./index.html" hx-get="./fragments/page-1.html" hx-push-url="./index.html">1</a></li>
        <li><a href="./page-2.html" hx-get="./fragments/page-2.html" hx-push-url="./page-2.html" aria-current="page">2</a></li>
        <li><a href="./page-3.html" hx-get="./fragments/page-3.html" hx-push-url="./page-3.html">3</a></li>
        <li><a href="./page-3.html" hx-get="./fragments/page-3.html" hx-push-url="./page-3.html" aria-label="次のページへ">次</a></li>
      </kata-pagination>
    </main>
  </body>
</html>
