<!-- Canonical Shadow DOM fallback templates for <kata-sheet>. Copy only the templates required by the page. -->
<template id="kata-sheet-template">
      <button type="button" data-sheet-trigger><slot name="trigger">右からシートを開く</slot></button>
      <div data-sheet-overlay hidden></div>
      <div role="dialog" aria-modal="true" aria-labelledby="kata-sheet__title" data-sheet-panel hidden>
        <div class="kata-sheet__header">
          <h2 id="kata-sheet__title" class="kata-sheet__title"><slot name="title">設定</slot></h2>
          <button type="button" data-sheet-close aria-label="閉じる">×</button>
        </div>
        <div class="kata-sheet__content">
          <slot><p>ここにシートのコンテンツが入ります。</p><input type="text" placeholder="テキスト入力"></slot>
        </div>
        <div class="kata-sheet__footer">
          <button type="button" data-sheet-close><slot name="cancel">キャンセル</slot></button>
          <button type="button" data-sheet-confirm data-sheet-close><slot name="confirm">保存</slot></button>
        </div>
      </div>
    </template>
