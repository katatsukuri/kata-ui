<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-dialog example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-dialog.css">
</head>
<body>
  <h1>kata-dialog examples</h1>

  <template id="kata-dialog-template">
    <button type="button" data-dialog-trigger><slot name="trigger">ダイアログを開く</slot></button>
    <dialog aria-labelledby="kata-dialog__title" aria-describedby="dialog-desc">
      <div class="kata-dialog__header">
        <h2 id="kata-dialog__title" class="kata-dialog__title"><slot name="title">確認</slot></h2>
        <p id="dialog-desc" class="kata-dialog__description"><slot name="description">この操作は元に戻せません。本当に続けますか？</slot></p>
      </div>
      <div class="kata-dialog__content">
        <slot><p>削除するとすべてのデータが失われます。</p></slot>
      </div>
      <div class="kata-dialog__footer">
        <button type="button" data-dialog-close><slot name="cancel">キャンセル</slot></button>
        <button type="button" data-dialog-close><slot name="confirm">削除する</slot></button>
      </div>
    </dialog>
  </template>

  <kata-dialog>
    <span slot="trigger">ダイアログを開く</span>
    <span slot="title">確認</span>
    <span slot="description">この操作は元に戻せません。</span>
    <p>削除するとすべてのデータが失われます。</p>
    <span slot="cancel">キャンセル</span>
    <span slot="confirm">削除する</span>
  </kata-dialog>

  <script type="module" src="../kata-dialog.js"></script>
</body>
</html>
