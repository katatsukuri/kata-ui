<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-dropdown-menu example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-dropdown-menu.css">
</head>
<body>
  <h1>kata-dropdown-menu examples</h1>

  <template id="kata-dropdown-menu-template">
    <button type="button" data-dropdown-trigger
            aria-haspopup="menu" aria-expanded="false"><slot name="trigger">アカウント ▾</slot></button>
    <div data-dropdown-content role="menu" hidden>
      <slot><button type="button" role="menuitem">メニュー項目</button></slot>
    </div>
  </template>

  <kata-dropdown-menu>
    <span slot="trigger">アカウント ▾</span>
    <button type="button" role="menuitem">プロフィール</button>
    <button type="button" role="menuitem">設定</button>
    <button type="button" role="menuitem">ログアウト</button>
  </kata-dropdown-menu>

  <script type="module" src="../kata-dropdown-menu.js"></script>
</body>
</html>
