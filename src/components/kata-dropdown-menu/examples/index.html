<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-dropdown-menu example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-dropdown-menu.css">
</head>
<body>
  <h1>kata-dropdown-menu examples</h1>

  <template id="kata-dropdown-menu-template">
    <button type="button" data-dropdown-trigger
            aria-haspopup="menu" aria-expanded="false"><slot name="trigger">アカウント ▾</slot></button>
    <div data-dropdown-content role="menu" hidden>
      <button type="button" role="menuitem"><slot name="item-1">プロフィール</slot></button>
      <button type="button" role="menuitem"><slot name="item-2">設定</slot></button>
      <button type="button" role="menuitem"><slot name="item-3">ログアウト</slot></button>
    </div>
  </template>

  <kata-dropdown-menu>
    <span slot="trigger">アカウント ▾</span>
    <span slot="item-1">プロフィール</span>
    <span slot="item-2">設定</span>
    <span slot="item-3">ログアウト</span>
  </kata-dropdown-menu>

  <script type="module" src="../kata-dropdown-menu.js"></script>
</body>
</html>
