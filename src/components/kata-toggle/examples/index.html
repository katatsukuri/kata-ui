<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-toggle example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-toggle.css">
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    label { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>kata-toggle examples</h1>

  <template id="kata-toggle-template">
    <label>
      <button type="button" data-toggle-track role="switch"
              aria-checked="false" tabindex="0">
        <span data-toggle-thumb></span>
      </button>
      <slot name="label">通知を受け取る</slot>
    </label>
  </template>

  <p><kata-toggle id="toggle-basic"><span slot="label">通知を受け取る</span></kata-toggle></p>

  <p><kata-toggle id="toggle-checked" checked><span slot="label">初期オン</span></kata-toggle></p>

  <p><kata-toggle id="toggle-disabled" disabled><span slot="label">無効化</span></kata-toggle></p>

  <p id="status">状態: —</p>

  <script type="module" src="../kata-toggle.js"></script>
  <script type="module">
    document.querySelectorAll('kata-toggle').forEach((el) => {
      el.addEventListener('change', (e) => {
        document.getElementById('status').textContent =
          `状態: ${e.target.id} → ${e.detail.checked ? 'ON' : 'OFF'}`;
      });
    });
  </script>
</body>
</html>
