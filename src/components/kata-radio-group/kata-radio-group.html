<!-- Canonical Shadow DOM fallback templates for <kata-radio-group>. Copy only the templates required by the page. -->
<template id="kata-radio-group-template">
    <fieldset>
      <legend>性別</legend>
      <label><input type="radio" name="gender" value="male"> 男性</label>
      <label><input type="radio" name="gender" value="female"> 女性</label>
      <label><input type="radio" name="gender" value="other"> その他</label>
    </fieldset>
  </template>

<template id="kata-radio-group-color-template">
    <fieldset>
      <legend>好きな色</legend>
      <label><input type="radio" name="color" value="red"> 赤</label>
      <label><input type="radio" name="color" value="blue"> 青</label>
      <label><input type="radio" name="color" value="green"> 緑</label>
    </fieldset>
  </template>
