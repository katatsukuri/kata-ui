<!-- Canonical Shadow DOM fallback templates for <kata-checkbox>. Copy only the templates required by the page. -->
<template id="kata-checkbox-template">
    <label>
      <input type="checkbox" name="agree">
      <slot name="label">利用規約に同意する</slot>
    </label>
  </template>

<template id="kata-checkbox-disabled-template">
    <label>
      <input type="checkbox" name="newsletter" disabled>
      <slot name="label">メールマガジンを受け取る（現在利用不可）</slot>
    </label>
  </template>
