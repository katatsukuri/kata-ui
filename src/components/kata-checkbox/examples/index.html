<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-checkbox example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-checkbox.css">
</head>
<body>
  <h1>kata-checkbox examples</h1>

  <template id="kata-checkbox-template">
    <label>
      <input type="checkbox" name="agree">
      <slot name="label">利用規約に同意する</slot>
    </label>
  </template>

  <template id="kata-checkbox-disabled-template">
    <label>
      <input type="checkbox" name="newsletter" disabled>
      <slot name="label">メールマガジンを受け取る（現在利用不可）</slot>
    </label>
  </template>

  <p><kata-checkbox><span slot="label">利用規約に同意する</span></kata-checkbox></p>
  <p><kata-checkbox template="kata-checkbox-disabled-template"><span slot="label">現在利用できません</span></kata-checkbox></p>

  <script type="module" src="../kata-checkbox.js"></script>
</body>
</html>
