<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-hover-card example</title>
  <link rel="stylesheet" href="../../../styles/kata-ui.css">
  <link rel="stylesheet" href="../kata-hover-card.css">
  <style>
    body { font-family: sans-serif; padding: 4rem; }
  </style>
</head>
<body>
  <h1>kata-hover-card examples</h1>

  <template id="kata-hover-card-template">
    <button type="button" data-hover-card-trigger><slot name="trigger">山田太郎</slot></button>
    <div data-kata-hover-card__content class="kata-hover-card__content" hidden>
      <p class="kata-hover-card__title"><slot name="title">山田太郎</slot></p>
      <p class="kata-hover-card__description"><slot name="description">2023年1月から利用中</slot></p>
    </div>
  </template>

  <kata-hover-card>
    <span slot="trigger">山田太郎</span>
    <span slot="title">山田太郎</span>
    <span slot="description">2023年1月から利用中</span>
  </kata-hover-card>

  <script type="module" src="../kata-hover-card.js"></script>
</body>
</html>
