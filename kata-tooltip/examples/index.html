<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kata-tooltip example</title>
  <link rel="stylesheet" href="../../kata-tooltip/kata-tooltip.css">
  <style>
    body { font-family: sans-serif; padding: 4rem 2rem; display: flex; gap: 3rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1 style="width:100%">kata-tooltip examples</h1>

  <!-- Top (default) -->
  <template id="kata-tooltip-template">
    <button type="button" class="tooltip-trigger" aria-describedby="tip-top">
      上（デフォルト）
    </button>
    <div class="tooltip-content" id="tip-top" role="tooltip" data-side="top">
      上に表示されます
    </div>
  </template>

  <!-- Bottom -->
  <template id="kata-tooltip-bottom-template">
    <button type="button" class="tooltip-trigger" aria-describedby="tip-bottom">
      下
    </button>
    <div class="tooltip-content" id="tip-bottom" role="tooltip" data-side="bottom">
      下に表示されます
    </div>
  </template>

  <!-- Left -->
  <template id="kata-tooltip-left-template">
    <button type="button" class="tooltip-trigger" aria-describedby="tip-left">
      左
    </button>
    <div class="tooltip-content" id="tip-left" role="tooltip" data-side="left">
      左に表示されます
    </div>
  </template>

  <!-- Right -->
  <template id="kata-tooltip-right-template">
    <button type="button" class="tooltip-trigger" aria-describedby="tip-right">
      右
    </button>
    <div class="tooltip-content" id="tip-right" role="tooltip" data-side="right">
      右に表示されます
    </div>
  </template>

  <kata-tooltip></kata-tooltip>
  <kata-tooltip template="kata-tooltip-bottom-template"></kata-tooltip>
  <kata-tooltip template="kata-tooltip-left-template"></kata-tooltip>
  <kata-tooltip template="kata-tooltip-right-template"></kata-tooltip>

  <script type="module" src="../../kata-tooltip/kata-tooltip.js"></script>
</body>
</html>
