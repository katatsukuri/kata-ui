<!-- Canonical Light DOM templates for <kata-popover>. Copy only the templates required by the page. -->
<template id="kata-popover-template">
  <button type="button" data-popover-trigger aria-expanded="false">
    詳細
  </button>
  <div data-popover-content hidden role="dialog" aria-label="詳細情報">
    <strong>ポップオーバー</strong>
    <p>補足情報を表示します。</p>
  </div>
</template>

    </template>
