<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dense-table example</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="../../dense-table.css">
    <script type="module" src="../../dense-table.js"></script>
  </head>
  <body class="container">
    <main>
      <h1>dense-table prototype</h1>

      <template id="dense-table-template">
        <table class="dense-table">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Role</th>
            </tr>
          </thead>
          <tbody hx-target="this" hx-swap="innerHTML">
            <tr>
              <td>Yoshua Nakashima</td>
              <td>Maintainer</td>
            </tr>
            <tr>
              <td>Kata UI</td>
              <td>Prototype</td>
            </tr>
          </tbody>
        </table>
      </template>

      <dense-table></dense-table>
    </main>
  </body>
</html>
